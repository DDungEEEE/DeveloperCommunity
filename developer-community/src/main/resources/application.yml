spring:
  application:
    name: DeveloperCommunity
  config:
    import: "optional:file:.env.properties"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
    show-sql: true
    hibernate:
#      ddl-auto: update
      ddl-auto: none
server:
  port: 30000